<svg width="700" height="180" viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ruleTitle ruleDesc">
  <title id="ruleTitle">P-Bit Update Rule</title>
  <desc id="ruleDesc">Mathematical formulas showing the p-bit optimizer update rule with annealing schedule</desc>

  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
  </defs>

  <rect width="700" height="180" fill="url(#bg3)" rx="12"/>

  <text x="350" y="28" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="600">
    Update Rule
  </text>

  <text x="350" y="56" text-anchor="middle" fill="#5e6ad2" font-size="12" font-weight="500">
    beta(t)  = schedule(t)
  </text>
  <text x="350" y="76" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="500">
    g_scale = mean(|grad|) + eps
  </text>
  <text x="350" y="96" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="500">
    P(+1)   = sigmoid(-beta * grad / g_scale)
  </text>
  <text x="350" y="116" text-anchor="middle" fill="#a1a1aa" font-size="12">
    sigma   ~ Bernoulli(P(+1)) in {+1, -1}
  </text>
  <text x="350" y="136" text-anchor="middle" fill="#71717a" font-size="12">
    step    = lr * |grad| * sigma
  </text>
  <text x="350" y="156" text-anchor="middle" fill="#52525b" font-size="11">
    x       = x + step
  </text>
</svg>
