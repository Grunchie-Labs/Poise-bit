<svg width="700" height="180" viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2f4a"/>
    </linearGradient>
  </defs>

  <rect width="700" height="180" fill="url(#bg3)" rx="12"/>

  <text x="350" y="28" text-anchor="middle" fill="#e0f7fa" font-size="14" font-weight="bold">
    Update Rule
  </text>

  <text x="350" y="58" text-anchor="middle" fill="#00d4ff" font-size="12">
    beta(t)  = schedule(t)
  </text>
  <text x="350" y="78" text-anchor="middle" fill="#00ff9d" font-size="12">
    g_scale = mean(|grad|) + eps
  </text>
  <text x="350" y="98" text-anchor="middle" fill="#ff9800" font-size="12">
    P(+1)   = sigmoid(-beta * grad / g_scale)
  </text>
  <text x="350" y="118" text-anchor="middle" fill="#e0f7fa" font-size="12">
    sigma   ~ Bernoulli(P(+1)) in {+1, -1}
  </text>
  <text x="350" y="138" text-anchor="middle" fill="#80deea" font-size="12">
    step    = lr * |grad| * sigma
  </text>
  <text x="350" y="158" text-anchor="middle" fill="#b0bec5" font-size="11">
    x       = x + step
  </text>

  <circle cx="660" cy="90" r="25" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="22;30;22" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="90" r="7" fill="#00d4ff">
    <animate attributeName="fill" values="#00d4ff;#00ff9d;#00d4ff" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
