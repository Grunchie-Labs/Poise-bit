<svg width="100%" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px; font-family: 'Segoe UI', system-ui, sans-serif;">
    <defs>
      <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a1628"/>
        <stop offset="100%" stop-color="#1a2f4a"/>
      </linearGradient>
    </defs>

    <rect width="700" height="200" fill="url(#bg3)" rx="12"/>

    <text x="350" y="30" text-anchor="middle" fill="#e0f7fa" font-size="14" font-weight="bold">
      Update Rule
    </text>

    <text x="350" y="65" text-anchor="middle" fill="#00d4ff" font-size="12">
      β(t)  = schedule(t)
    </text>
    <text x="350" y="88" text-anchor="middle" fill="#00ff9d" font-size="12">
      ḡ    = mean(|grad|) + ε
    </text>
    <text x="350" y="111" text-anchor="middle" fill="#ff9800" font-size="12">
      P(+1) = σ(−β · grad / ḡ)
    </text>
    <text x="350" y="134" text-anchor="middle" fill="#e0f7fa" font-size="12">
      σ     ~ Bernoulli(P(+1)) ∈ {+1, −1}
    </text>
    <text x="350" y="157" text-anchor="middle" fill="#80deea" font-size="12">
      step  = lr · |grad| · σ
    </text>
    <text x="350" y="180" text-anchor="middle" fill="#b0bec5" font-size="11">
      x ← x + step
    </text>

    <circle cx="680" cy="100" r="30" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="25;35;25" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="100" r="8" fill="#00d4ff">
      <animate attributeName="fill" values="#00d4ff;#00ff9d;#00d4ff" dur="2s" repeatCount="indefinite"/>
    </circle>
  </svg>