<svg width="100%" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" style="max-width: 760px; font-family: 'Segoe UI', system-ui, sans-serif;">
    <defs>
      <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a1628"/>
        <stop offset="100%" stop-color="#1a2f4a"/>
      </linearGradient>
      <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#00d4ff"/>
        <stop offset="100%" stop-color="#006680"/>
      </linearGradient>
      <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#00ff9d"/>
        <stop offset="100%" stop-color="#00804d"/>
      </linearGradient>
      <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ff9800"/>
        <stop offset="100%" stop-color="#994d00"/>
      </linearGradient>
    </defs>

    <rect width="760" height="340" fill="url(#bg2)" rx="12"/>

    <text x="380" y="35" text-anchor="middle" fill="#e0f7fa" font-size="18" font-weight="bold">
      PBit vs Baselines — 4-bit Quantized Rastrigin
    </text>
    <text x="380" y="55" text-anchor="middle" fill="#80deea" font-size="11">
      Lower final best loss is better
    </text>

    <line x1="80" y1="70" x2="680" y2="70" stroke="#1e3a5f" stroke-width="1"/>

    <g transform="translate(80, 80)">
      <text x="0" y="120" text-anchor="middle" fill="#b0bec5" font-size="11">PBit</text>
      <rect x="-25" y="0" width="50" height="120" fill="url(#bar1)" rx="4">
        <animate attributeName="height" values="0;120;120" dur="1.5s" fill="freeze"/>
        <animate attributeName="y" values="120;0;0" dur="1.5s" fill="freeze"/>
      </rect>
      <text x="0" y="-8" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">10.05</text>
    </g>

    <g transform="translate(220, 80)">
      <text x="0" y="120" text-anchor="middle" fill="#b0bec5" font-size="11">Adam</text>
      <rect x="-25" y="0" width="50" height="106" fill="url(#bar3)" rx="4">
        <animate attributeName="height" values="0;106;106" dur="1.5s" fill="freeze" begin="0.3s"/>
        <animate attributeName="y" values="120;14;14" dur="1.5s" fill="freeze" begin="0.3s"/>
      </rect>
      <text x="0" y="-8" text-anchor="middle" fill="#ff9800" font-size="12" font-weight="bold">14.26</text>
    </g>

    <g transform="translate(360, 80)">
      <text x="0" y="120" text-anchor="middle" fill="#b0bec5" font-size="11">SGD</text>
      <rect x="-25" y="0" width="50" height="89" fill="url(#bar2)" rx="4">
        <animate attributeName="height" values="0;89;89" dur="1.5s" fill="freeze" begin="0.6s"/>
        <animate attributeName="y" values="120;31;31" dur="1.5s" fill="freeze" begin="0.6s"/>
      </rect>
      <text x="0" y="-8" text-anchor="middle" fill="#00ff9d" font-size="12" font-weight="bold">11.19</text>
    </g>

    <g transform="translate(500, 80)">
      <text x="0" y="120" text-anchor="middle" fill="#b0bec5" font-size="11">SignSGD</text>
      <rect x="-25" y="0" width="50" height="102" fill="url(#bar1)" rx="4" opacity="0.7">
        <animate attributeName="height" values="0;102;102" dur="1.5s" fill="freeze" begin="0.9s"/>
        <animate attributeName="y" values="120;18;18" dur="1.5s" fill="freeze" begin="0.9s"/>
      </rect>
      <text x="0" y="-8" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold" opacity="0.8">16.25</text>
    </g>

    <line x1="80" y1="200" x2="680" y2="200" stroke="#1e3a5f" stroke-width="1"/>

    <text x="380" y="230" text-anchor="middle" fill="#e0f7fa" font-size="16" font-weight="bold">
      Rosenbrock Convergence Speed
    </text>
    <text x="380" y="250" text-anchor="middle" fill="#80deea" font-size="11">
      Median iterations to reach threshold — lower is better
    </text>

    <g transform="translate(140, 260)">
      <text x="0" y="50" text-anchor="middle" fill="#b0bec5" font-size="11">PBit</text>
      <rect x="-25" y="0" width="50" height="50" fill="url(#bar2)" rx="4">
        <animate attributeName="height" values="0;50;50" dur="1.2s" fill="freeze" begin="1.2s"/>
        <animate attributeName="y" values="50;0;0" dur="1.2s" fill="freeze" begin="1.2s"/>
      </rect>
      <text x="0" y="-8" text-anchor="middle" fill="#00ff9d" font-size="12" font-weight="bold">51</text>
    </g>

    <g transform="translate(300, 260)">
      <text x="0" y="50" text-anchor="middle" fill="#b0bec5" font-size="11">Adam</text>
      <rect x="-25" y="0" width="50" height="12" fill="url(#bar3)" rx="4">
        <animate attributeName="height" values="0;12;12" dur="1.2s" fill="freeze" begin="1.5s"/>
        <animate attributeName="y" values="50;38;38" dur="1.2s" fill="freeze" begin="1.5s"/>
      </rect>
      <text x="0" y="-8" text-anchor="middle" fill="#ff9800" font-size="12" font-weight="bold">180</text>
    </g>

    <g transform="translate(460, 260)">
      <text x="0" y="50" text-anchor="middle" fill="#b0bec5" font-size="11">RMSProp</text>
      <rect x="-25" y="0" width="50" height="32" fill="url(#bar1)" rx="4">
        <animate attributeName="height" values="0;32;32" dur="1.2s" fill="freeze" begin="1.8s"/>
        <animate attributeName="y" values="50;18;18" dur="1.2s" fill="freeze" begin="1.8s"/>
      </rect>
      <text x="0" y="-8" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">156</text>
    </g>

    <g transform="translate(620, 260)">
      <text x="0" y="50" text-anchor="middle" fill="#b0bec5" font-size="11">SGD</text>
      <rect x="-25" y="0" width="50" height="8" fill="url(#bar2)" rx="4" opacity="0.6">
        <animate attributeName="height" values="0;8;8" dur="1.2s" fill="freeze" begin="2.1s"/>
        <animate attributeName="y" values="50;42;42" dur="1.2s" fill="freeze" begin="2.1s"/>
      </rect>
      <text x="0" y="-8" text-anchor="middle" fill="#00ff9d" font-size="12" font-weight="bold" opacity="0.7">500</text>
    </g>

    <text x="380" y="325" text-anchor="middle" fill="#546e7a" font-size="10">
      Full results in results_and_conclusion.md
    </text>
  </svg>