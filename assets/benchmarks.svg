<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="benchTitle benchDesc">
  <title id="benchTitle">PBit vs Baselines Benchmark</title>
  <desc id="benchDesc">Horizontal bar charts comparing PBit against baselines on 4-bit quantized Rastrigin and Rosenbrock</desc>

  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e6ad2"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="760" height="340" fill="url(#bg2)" rx="12"/>

  <text x="380" y="28" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="600">
    PBit vs Baselines — 4-bit Quantized Rastrigin
  </text>
  <text x="380" y="46" text-anchor="middle" fill="#71717a" font-size="10">
    Lower final best loss is better
  </text>

  <line x1="80" y1="60" x2="680" y2="60" stroke="#27272a" stroke-width="1"/>

  <g transform="translate(80, 80)">
    <text x="0" y="12" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="500">PBit</text>
    <rect x="0" y="18" width="150" height="18" fill="url(#bar1)" rx="4"/>
    <text x="160" y="32" text-anchor="start" fill="#fafafa" font-size="12" font-weight="600">10.05</text>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="12" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="500">Adam</text>
    <rect x="0" y="18" width="130" height="18" fill="url(#bar3)" rx="4"/>
    <text x="160" y="32" text-anchor="start" fill="#fafafa" font-size="12" font-weight="600">14.26</text>
  </g>

  <g transform="translate(80, 140)">
    <text x="0" y="12" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="500">SGD</text>
    <rect x="0" y="18" width="110" height="18" fill="url(#bar2)" rx="4"/>
    <text x="160" y="32" text-anchor="start" fill="#fafafa" font-size="12" font-weight="600">11.19</text>
  </g>

  <g transform="translate(80, 170)">
    <text x="0" y="12" text-anchor="middle" fill="#a1a1aa" font-size="11" font-weight="500">SignSGD</text>
    <rect x="0" y="18" width="95" height="18" fill="url(#bar1)" rx="4" opacity="0.6"/>
    <text x="160" y="32" text-anchor="start" fill="#a1a1aa" font-size="12" font-weight="500">16.25</text>
  </g>

  <line x1="80" y1="210" x2="680" y2="210" stroke="#27272a" stroke-width="1"/>

  <text x="380" y="232" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="600">
    Rosenbrock Convergence Speed
  </text>
  <text x="380" y="248" text-anchor="middle" fill="#71717a" font-size="10">
    Median iterations to reach threshold — lower is better
  </text>

  <g transform="translate(80, 266)">
    <text x="0" y="12" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="500">PBit</text>
    <rect x="0" y="18" width="50" height="18" fill="url(#bar2)" rx="4"/>
    <text x="160" y="32" text-anchor="start" fill="#fafafa" font-size="12" font-weight="600">51</text>
  </g>

  <g transform="translate(80, 296)">
    <text x="0" y="12" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="500">Adam</text>
    <rect x="0" y="18" width="12" height="18" fill="url(#bar3)" rx="4"/>
    <text x="160" y="32" text-anchor="start" fill="#fafafa" font-size="12" font-weight="600">180</text>
  </g>

  <g transform="translate(260, 266)">
    <text x="0" y="12" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="500">RMSProp</text>
    <rect x="0" y="18" width="30" height="18" fill="url(#bar1)" rx="4"/>
    <text x="160" y="32" text-anchor="start" fill="#fafafa" font-size="12" font-weight="600">156</text>
  </g>

  <g transform="translate(260, 296)">
    <text x="0" y="12" text-anchor="middle" fill="#a1a1aa" font-size="11" font-weight="500">SGD</text>
    <rect x="0" y="18" width="8" height="18" fill="url(#bar2)" rx="4" opacity="0.5"/>
    <text x="160" y="32" text-anchor="start" fill="#a1a1aa" font-size="12" font-weight="500">500</text>
  </g>

  <text x="380" y="332" text-anchor="middle" fill="#52525b" font-size="10">
    Full results in results_and_conclusion.md
  </text>
</svg>
