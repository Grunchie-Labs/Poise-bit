<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2f4a"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#006680"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00804d"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#994d00"/>
    </linearGradient>
  </defs>

  <rect width="760" height="320" fill="url(#bg2)" rx="12"/>

  <text x="380" y="30" text-anchor="middle" fill="#e0f7fa" font-size="16" font-weight="bold">
    PBit vs Baselines — 4-bit Quantized Rastrigin
  </text>
  <text x="380" y="50" text-anchor="middle" fill="#80deea" font-size="10">
    Lower final best loss is better
  </text>

  <line x1="80" y1="65" x2="680" y2="65" stroke="#1e3a5f" stroke-width="1"/>

  <g transform="translate(80, 75)">
    <text x="0" y="115" text-anchor="middle" fill="#b0bec5" font-size="11">PBit</text>
    <rect x="-25" y="0" width="50" height="115" fill="url(#bar1)" rx="4">
      <animate attributeName="height" values="0;115;115" dur="1.5s" fill="freeze"/>
      <animate attributeName="y" values="115;0;0" dur="1.5s" fill="freeze"/>
    </rect>
    <text x="0" y="-10" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">10.05</text>
  </g>

  <g transform="translate(220, 75)">
    <text x="0" y="115" text-anchor="middle" fill="#b0bec5" font-size="11">Adam</text>
    <rect x="-25" y="0" width="50" height="102" fill="url(#bar3)" rx="4">
      <animate attributeName="height" values="0;102;102" dur="1.5s" fill="freeze" begin="0.3s"/>
      <animate attributeName="y" values="115;13;13" dur="1.5s" fill="freeze" begin="0.3s"/>
    </rect>
    <text x="0" y="-10" text-anchor="middle" fill="#ff9800" font-size="12" font-weight="bold">14.26</text>
  </g>

  <g transform="translate(360, 75)">
    <text x="0" y="115" text-anchor="middle" fill="#b0bec5" font-size="11">SGD</text>
    <rect x="-25" y="0" width="50" height="85" fill="url(#bar2)" rx="4">
      <animate attributeName="height" values="0;85;85" dur="1.5s" fill="freeze" begin="0.6s"/>
      <animate attributeName="y" values="115;30;30" dur="1.5s" fill="freeze" begin="0.6s"/>
    </rect>
    <text x="0" y="-10" text-anchor="middle" fill="#00ff9d" font-size="12" font-weight="bold">11.19</text>
  </g>

  <g transform="translate(500, 75)">
    <text x="0" y="115" text-anchor="middle" fill="#b0bec5" font-size="11">SignSGD</text>
    <rect x="-25" y="0" width="50" height="97" fill="url(#bar1)" rx="4" opacity="0.7">
      <animate attributeName="height" values="0;97;97" dur="1.5s" fill="freeze" begin="0.9s"/>
      <animate attributeName="y" values="115;18;18" dur="1.5s" fill="freeze" begin="0.9s"/>
    </rect>
    <text x="0" y="-10" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold" opacity="0.8">16.25</text>
  </g>

  <line x1="80" y1="195" x2="680" y2="195" stroke="#1e3a5f" stroke-width="1"/>

  <text x="380" y="220" text-anchor="middle" fill="#e0f7fa" font-size="14" font-weight="bold">
    Rosenbrock Convergence Speed
  </text>
  <text x="380" y="238" text-anchor="middle" fill="#80deea" font-size="10">
    Median iterations to reach threshold — lower is better
  </text>

  <g transform="translate(140, 250)">
    <text x="0" y="50" text-anchor="middle" fill="#b0bec5" font-size="11">PBit</text>
    <rect x="-25" y="0" width="50" height="50" fill="url(#bar2)" rx="4">
      <animate attributeName="height" values="0;50;50" dur="1.2s" fill="freeze" begin="1.2s"/>
      <animate attributeName="y" values="50;0;0" dur="1.2s" fill="freeze" begin="1.2s"/>
    </rect>
    <text x="0" y="-10" text-anchor="middle" fill="#00ff9d" font-size="12" font-weight="bold">51</text>
  </g>

  <g transform="translate(300, 250)">
    <text x="0" y="50" text-anchor="middle" fill="#b0bec5" font-size="11">Adam</text>
    <rect x="-25" y="0" width="50" height="12" fill="url(#bar3)" rx="4">
      <animate attributeName="height" values="0;12;12" dur="1.2s" fill="freeze" begin="1.5s"/>
      <animate attributeName="y" values="50;38;38" dur="1.2s" fill="freeze" begin="1.5s"/>
    </rect>
    <text x="0" y="-10" text-anchor="middle" fill="#ff9800" font-size="12" font-weight="bold">180</text>
  </g>

  <g transform="translate(460, 250)">
    <text x="0" y="50" text-anchor="middle" fill="#b0bec5" font-size="11">RMSProp</text>
    <rect x="-25" y="0" width="50" height="30" fill="url(#bar1)" rx="4">
      <animate attributeName="height" values="0;30;30" dur="1.2s" fill="freeze" begin="1.8s"/>
      <animate attributeName="y" values="50;20;20" dur="1.2s" fill="freeze" begin="1.8s"/>
    </rect>
    <text x="0" y="-10" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">156</text>
  </g>

  <g transform="translate(620, 250)">
    <text x="0" y="50" text-anchor="middle" fill="#b0bec5" font-size="11">SGD</text>
    <rect x="-25" y="0" width="50" height="8" fill="url(#bar2)" rx="4" opacity="0.6">
      <animate attributeName="height" values="0;8;8" dur="1.2s" fill="freeze" begin="2.1s"/>
      <animate attributeName="y" values="50;42;42" dur="1.2s" fill="freeze" begin="2.1s"/>
    </rect>
    <text x="0" y="-10" text-anchor="middle" fill="#00ff9d" font-size="12" font-weight="bold" opacity="0.7">500</text>
  </g>

  <text x="380" y="310" text-anchor="middle" fill="#546e7a" font-size="10">
    Full results in results_and_conclusion.md
  </text>
</svg>
