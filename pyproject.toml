[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pbit"
version = "0.4.0"
description = "Probabilistic p-bit optimization, low-precision gradient robustness, and reproducible optimizer benchmarking."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Grunchie Labs", email = "contact@grunchielabs.example.invalid" },
]
keywords = [
    "pbit", "probabilistic computing", "stochastic optimization",
    "low-precision", "quantization", "benchmarking", "optimizer",
    "annealing", "boltzmann", "binary-direction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://grunchielabs.example.invalid/pbit"
Documentation = "https://grunchielabs.example.invalid/pbit/docs"
Source = "https://github.com/grunchielabs/pbit"
"Repository" = "https://github.com/grunchielabs/pbit"
"Bug Tracker" = "https://github.com/grunchielabs/pbit/issues"

[project.optional-dependencies]
bench = ["matplotlib>=3.6", "pandas>=2.0", "tqdm>=4.66"]
torch = ["torch>=2.0"]
plots = ["matplotlib>=3.6"]
tables = ["pandas>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["pbit"]

[tool.hatch.version]
path = "pbit/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "torch: tests that require torch installed (deselect with -m 'not torch')",
    "perf: performace smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
